
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaptan AI</title>
<style>
body{margin:0;background:#10131a;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#191e29;border-bottom:1px solid #343b4b}
h2{margin:0;color:#8da2ff}
#chat{height:70vh;overflow-y:auto;padding:16px}
.msg{padding:12px;margin:10px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.ai{background:#222a38;margin-right:25px}
.user{background:#354574;margin-left:25px}
form{display:flex;gap:8px;padding:12px}
input{flex:1;min-width:0;padding:14px;border-radius:10px;border:1px solid #454c60;background:#202631;color:white;font-size:16px}
button{background:#7185ff;color:white;border:0;border-radius:10px;padding:12px;font-size:15px}
small{color:#aab2c3;padding:12px}
</style>
</head>
<body>
<header>
<h2>⚓ Kaptan AI</h2>
<p>Bağımsız yapay zekâ projemiz</p>
</header>
<div id="chat">
<div class="msg ai">Selam kaptan! ⚓

Ben Kaptan AI'nin ilk sürümüyüm. Henüz gerçek bir yapay zekâya bağlı değilim ama birlikte geliştireceğiz!</div>
</div>
<form id="form">
<input id="input" placeholder="Mesajını yaz..." autocomplete="off">
<button type="submit">Gönder</button>
</form>
<small>İlk sürüm · Geliştirme aşamasında</small>
<script>
const form=document.getElementById('form');
const input=document.getElementById('input');
const chat=document.getElementById('chat');
form.addEventListener('submit',function(e){
e.preventDefault();
const value=input.value.trim();
if(!value)return;
const user=document.createElement('div');
user.className='msg user';
user.textContent=value;
chat.appendChild(user);
const reply=document.createElement('div');
reply.className='msg ai';
reply.textContent='Mesajını aldım kaptan! ⚓ Gerçek yapay zekâ bağlantısını sonraki aşamada kuracağız.';
chat.appendChild(reply);
input.value='';
chat.scrollTop=chat.scrollHeight;
});
</script>
</body>
</html>
